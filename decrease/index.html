<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="뜨개 계산기">
  <title>코줄임/늘림 계산기</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <main class="container tool-page">
    <a class="back-link" href="../">← 돌아가기</a>

    <header class="tool-header">
      <h1>코줄임/늘림 계산기</h1>
      <p>현재 콧수와 목표 콧수를 입력하세요.</p>
    </header>

    <form id="stitchForm" class="calculator-form">
      <section class="form-section">
        <h2>콧수</h2>

        <label class="input-label" for="startStitches">
          시작 콧수
        </label>
        <div class="input-with-unit">
          <input
            type="number"
            id="startStitches"
            inputmode="numeric"
            step="1"
            min="1"
            required
          >
          <span>코</span>
        </div>

        <label class="input-label" for="endStitches">
          목표 콧수
        </label>
        <div class="input-with-unit">
          <input
            type="number"
            id="endStitches"
            inputmode="numeric"
            step="1"
            min="1"
            required
          >
          <span>코</span>
        </div>
      </section>

      <button class="calculate-button" type="submit">계산하기</button>
    </form>

    <section id="resultSection" class="result-section" hidden>
      <div class="result-header">
        <h2>계산 결과</h2>
        <button id="copyButton" class="copy-button" type="button">노션용 복사</button>
      </div>

      <pre id="resultText" class="result-text"></pre>


        <p id="checkResult" class="check-result" aria-live="polite"></p>
      </section>

      <p id="copyStatus" class="copy-status" aria-live="polite"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
