<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="뜨개 계산기">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="shortcut icon" href="./favicon.ico">
  <title>뜨개 계산기</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <header class="header">
      <h1>뜨개 계산기</h1>
    </header>

    <section class="calculator-grid">
      <a class="calculator-card" href="gauge/">
        <div class="icon gauge-icon">
          <span class="stitch-line"></span>
          <span class="stitch-line"></span>
          <span class="stitch-line"></span>
        </div>
        <span class="calculator-name">게이지 계산기</span>
      </a>

      <a class="calculator-card" href="ply/">
        <div class="icon ply-icon">
          <span class="yarn yarn-1"></span>
          <span class="yarn yarn-2"></span>
          <span class="yarn yarn-3"></span>
        </div>
        <span class="calculator-name">합사 계산기</span>
      </a>

      <a class="calculator-card" href="sleeve/">
        <div class="icon sleeve-icon">
          <span class="sleeve-body"></span>
        </div>
        <span class="calculator-name">소매 계산기</span>
      </a>

      <a class="calculator-card" href="decrease/">
        <div class="icon decrease-icon">
          <span class="decrease-row row-1"></span>
          <span class="decrease-row row-2"></span>
          <span class="decrease-row row-3"></span>
        </div>
        <span class="calculator-name">코줄임 계산기</span>
      </a>

       <a class="calculator-card" href="project-yarn/">
        <div class="icon project-yarn-icon">
          <span class="project-yarn-ball"></span>
          <span class="project-yarn-line line-a"></span>
          <span class="project-yarn-line line-b"></span>
        </div>
        <span class="calculator-name">프로젝트 실 계산기</span>
      </a>     
      
    </section>
  </main>
</body>
</html>
